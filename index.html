const SB_URL='https://aavzlrerdnnkmecpmjsi.supabase.co';

const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAM='<svg class="i" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>';
const HOME='<svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>';
const USER='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>';
let step='boot',me=null,prof=null,em='',tab='home',tp={},wait=0,busy=false,feed=[],following=new Set(),cdata={},mode='login',joinedC=new Set(),cl=[],cur=null,notifs=[],convs=[],pmap={},online=new Set(),rt=null,pres=null,chat=null,msgs=[],np={file:null,kind:''};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function nice(e){return (e&&(e.status===429||/rate|seconds/i.test(e.message||'')))?'Too many attempts. Please wait a minute and try again.':(e&&e.message)||'Something went wrong'}
function lock(on){busy=on;document.querySelectorAll('.btn').forEach(b=>b.disabled=on)}
async function sendCode(resend){
 if(busy)return;
 const e=resend?em:$('#em').value.trim().toLowerCase();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Enter a valid email address');return}
 if(resend&&Date.now()<wait){toast('Please wait a few seconds before resending');return}
 lock(true);
 const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true}});
 lock(false);
 if(error){toast(nice(error));return}
 em=e;wait=Date.now()+30000;
 if(resend)toast('New code sent');else{step='verify';draw()}
}
async function verify(){
 if(busy)return;
 const t=$('#cd').value.replace(/\D/g,'');
 if(t.length<6){toast('Enter the code from your email');return}
 lock(true);
 const {data,error}=await sb.auth.verifyOtp({email:em,token:t,type:'email'});
 lock(false);
 if(error||!data.user){toast('That code is wrong or has expired');return}
 me=data.user;
 if(mode=='signup'){const {data:ex}=await sb.from('profiles').select('id').eq('id',me.id).maybeSingle();if(ex){toast('You already have an account. Signed you in.');await enter();return}}
 step='pw';draw();
}
async function enter(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(error){toast('Could not load your profile: '+error.message);step='welcome';draw();return}
 prof=data;
 if(prof){step='app';tab='home';startRT()}else{tp={name:'',user:'',bio:''};step='setup'}
 draw();
}
function pick(w,inp){
 const f=inp.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){toast('Please choose an image');return}
 if(f.size>5*1024*1024){toast('Image is too large (max 5 MB)');return}
 tp[w+'File']=f;tp[w+'Prev']=URL.createObjectURL(f);draw();
}
async function up(bucket,file,onp){

setup:()=>{const av=tp.avatarPrev||(prof&&prof.avatar_url),cv=tp.coverPrev||(prof&&prof.cover_url);return `<div class="w" style="gap:10px"><h1>${prof?'Edit profile':'Create your profile'}</h1><p>Add a photo, a cover and a short bio so people know who you are.</p>
<input type="file" id="fc" accept="image/*" hidden onchange="pick('cover',this)"><input type="file" id="fa" accept="image/*" hidden onchange="pick('avatar',this)">
<div class="cvu" style="${cv?`background-image:url('${esc(cv)}')`:''}" onclick="$('#fc').click()">${cv?'':CAM+'Add cover photo'}</div>
<div class="dpu" onclick="$('#fa').click()">${av?`<img src="${esc(av)}" alt="">`:CAM}</div>
<div class="lbl">Full name</div><input class="fi" value="${esc(tp.name)}" oninput="tp.name=this.value" placeholder="Your name" maxlength="60">
<div class="lbl">Username</div><input class="fi" value="${esc(tp.user)}" oninput="tp.user=this.value.toLowerCase().replace(/[^a-z0-9._]/g,'');this.value=tp.user" placeholder="username" maxlength="20" autocapitalize="none" autocorrect="off">
<div class="lbl">Bio</div><textarea class="fi" rows="3" maxlength="150" oninput="tp.bio=this.value" placeholder="What do you do? Tell people in a line or two.">${esc(tp.bio)}</textarea>
<div class="lbl">Headline</div><input class="fi" maxlength="80" value="${esc(tp.headline||'')}" oninput="tp.headline=this.value" placeholder="e.g. Brand designer in Port Harcourt">
<div class="lbl">Skills (separate with commas, up to 8)</div><input class="fi" value="${esc(tp.skills||'')}" oninput="tp.skills=this.value" placeholder="Logo design, Branding, Illustrator">
<label class="chk"><input type="checkbox" ${tp.open?'checked':''} onchange="tp.open=this.checked"> I am open to work</label>
<button class="btn" onclick="save()">${prof?'Save changes':'Finish and start'}</button>${prof?`<button class="lk" onclick="step='app';draw()">Cancel</button>`:''}</div>`},
app:()=>{
 const hd=`<div class="hd"><div class="wm">Skillshow<b></b></div><div class="hi"><span onclick="tab='search';draw()">${SRCH}</span><span onclick="tab='notif';draw()">${HRT(0)}<i class="bd" id="nb"></i></span><span onclick="tab='msgs';draw()">${SND}<i class="bd" id="mb"></i></span></div></div>`;
 const nv=`<nav><span class="${tab=='home'?'on':''}" onclick="tab='home';draw()">${HOME}</span><span class="${tab=='jobs'||tab=='jview'?'on':''}" onclick="tab='jobs';draw()">${JOBI}</span><span class="${tab=='comm'||tab=='cview'?'on':''}" onclick="tab='comm';draw()">${GRP}</span><span onclick="openNew()">${PLS}</span><span class="${tab=='profile'?'on':''}" onclick="tab='profile';draw()">${USER}</span></nav>`;
 if(tab=='home')return hd+`<div id="stories"></div><div id="feed"><p class="co" style="padding:30px 20px;text-align:center">Loading feed…</p></div>`+nv;
 if(tab=='search')return `<div class="hd"><div class="bk2" onclick="tab='home';draw()">${BACK}</div><input class="fi" id="ps" placeholder="Search people by name or username" oninput="srchP()" style="flex:1;margin-left:12px"></div><div id="pres" style="padding-bottom:72px"></div>`+nv;
 if(tab=='user')return `<div class="hd"><div class="bk2" onclick="tab=ubk;draw()">${BACK}</div></div><div id="udet"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='jobs')return hd+`<div class="ctop"><b style="font-size:18px">Jobs</b><button class="jb" onclick="postJob()">Post a job</button></div><div class="jsg">${[['browse','Browse'],['mine','My jobs'],['applied','Applied']].map(x=>`<div class="${jseg==x[0]?'on':''}" onclick="jseg='${x[0]}';draw()">${x[1]}</div>`).join('')}</div><div id="jbody"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='jview')return `<div class="hd"><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;cursor:pointer" onclick="tab='jobs';draw()">${BACK}Jobs</div></div><div id="jdet"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='comm')return hd+`<div class="ctop"><b style="font-size:18px">Communities</b><button class="jb" onclick="newComm()">Create</button></div><div id="clist"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='cview')return `<div class="hd"><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;cursor:pointer" onclick="tab='comm';draw()">${BACK}Communities</div></div><div id="chead"></div><div id="feed"></div>`+nv;
 if(tab=='notif')return hb('Notifications')+`<div id="nlist"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='msgs')return hb('Messages')+`<div class="sb2"><input class="fi" id="sq" placeholder="Search people to message" oninput="srch(this.value)"></div><div id="sres"></div><div id="act"></div><div id="clistm"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='chat')return `<div class="hd"><div style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="tab='msgs';draw()">${BACK}<div id="chh"></div></div></div><div id="cmsgs"></div><div class="cbar"><div id="cpre"></div><div class="crow" id="crow">${crowHtml()}</div><input type="file" id="ca" accept="image/*" hidden onchange="pickAtt(this)"></div>`;
 return hd+`<div id="udet"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv}
};
function draw(){$('#app').innerHTML=V[step]();window.scrollTo(0,0);fabUpd();if(step=='app'){if(tab=='home'){loadFeed();loadStories()}else if(tab=='comm')loadComms();else if(tab=='jobs')loadJobs();else if(tab=='jview')loadJview();else if(tab=='cview')loadCview();else if(tab=='notif')loadNotifsView();else if(tab=='msgs')loadConvs();else if(tab=='chat')loadChat();else if(tab=='search')srchP(true);else if(tab=='user')loadUser();else{uid=me.id;loadUser()}if(tab!='notif')loadNotifs();if(tab!='msgs'&&tab!='chat')loadBadgeM()}}
(async()=>{
 draw();
 const {data}=await sb.auth.getSession();
 if(data.session){me=data.session.user;await enter()}else{step='welcome';draw()}
})();
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(g=>g.update()).catch(()=>{})});
 window.SkillshowBridge = {
  get sb() { return sb; },
  get me() { return me; },
  get prof() { return prof; },
  get feed() { return feed; },
  get cdata() { return cdata; },
  drawFeed,
  loadFeed,
  draw,
  toast,
  esc,
  avt,
  ago,
  setTab(value) {
    tab = value;
    step = 'app';
    draw();
  }
};
 </script>
 <script src="skillshow-patch.js"></script>

 <script src="community-admin.js?v=1"></script>
 <script src="layout.js?v=2"></script> 
 <script src="notifications.js?v=1"></script>
 <script src="messages.js?v=6"></script>
 <script src="tour.js?v=1"></script>
</body>
