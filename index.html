<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skillshow</title>
<style>
:root{--pr:#5B1424;--ac:#C8963E;--at:#1E1403;--bn:#5B1424;--bt:#fff;--bg:#fff;--tx:#1B2430;--mu:#5E6B7A;--ln:#E1E6EC;--so:#EEF2F7}
@media (prefers-color-scheme:dark){:root{--pr:#E8A5B3;--bn:#C8963E;--bt:#1E1403;--bg:#0A1423;--tx:#E8EEF6;--mu:#93A3B8;--ln:#1D2E45;--so:#12233A}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;max-width:480px;margin:0 auto;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wm{font-size:24px;font-weight:800;letter-spacing:-.8px;color:var(--pr)}.wm b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:2px}
.w{padding:22px 20px 40px;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;letter-spacing:-.6px;line-height:1.2}p{color:var(--mu);line-height:1.45}
.fi{width:100%;border:1px solid var(--ln);background:var(--so);color:var(--tx);border-radius:10px;padding:13px;font:inherit;outline:none}.fi:focus{border-color:var(--ac)}
.lbl{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:-6px}
.btn{border:0;border-radius:10px;padding:13px;font-weight:700;background:var(--bn);color:var(--bt);width:100%}.btn.o{background:var(--so);color:var(--tx)}.btn:disabled{opacity:.6}
.lk{background:none;border:0;color:var(--ac);font-weight:700;padding:8px}
.cvu{height:130px;border-radius:12px;background:var(--so) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mu);gap:8px;cursor:pointer;border:1px dashed var(--ln)}
.dpu{width:92px;height:92px;border-radius:50%;background:var(--so);border:4px solid var(--bg);margin:-46px 0 0 14px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer;overflow:hidden}
.dpu img,.dp img{width:100%;height:100%;object-fit:cover}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln)}
.cov{height:130px;background:var(--pr) center/cover}.pf{padding:0 14px 14px}
.dp{width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);margin-top:-42px;background:var(--so);color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;overflow:hidden}
.pn{margin:8px 0 4px}.pn b{font-size:18px;display:block}.pn small{color:var(--mu)}.bio{margin-bottom:12px}
.row{display:flex;gap:8px}.cd{margin:14px;border:1px solid var(--ln);border-radius:12px;padding:16px}.cd h3{margin-bottom:6px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav span{flex:1;display:flex;justify-content:center;color:var(--mu);cursor:pointer}nav .on{color:var(--tx)}
#feed,#mine,#clist{padding-bottom:72px}.co{color:var(--mu)}
.lr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);cursor:pointer}.lr b{display:block;font-size:14px}.lr small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jb{border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;background:var(--bn);color:var(--bt,#fff);flex:0 0 auto}.jb.j{background:var(--so);color:var(--tx)}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:14px}
.cvh{display:flex;gap:12px;align-items:center;padding:14px}.av.big{width:56px;height:56px;font-size:22px}
.post{border-bottom:1px solid var(--ln);padding-bottom:10px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--so);color:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:0 0 auto}.av img{width:100%;height:100%;object-fit:cover}
.ph b{display:block;font-size:13.5px}.ph small{color:var(--mu);font-size:12px}
.fl{margin-left:auto;border:0;background:none;color:var(--ac);font-weight:700;font-size:13px}
.md{position:relative;background:#000}.md img,.md video{width:100%;display:block;max-height:560px;object-fit:cover}
.wmk{position:absolute;right:12px;top:12px;color:#fff;font-size:13px;font-weight:800;opacity:.55;pointer-events:none;letter-spacing:-.4px}
.ac{display:flex;gap:16px;padding:10px 14px 4px}.ac span{cursor:pointer;display:flex}
.cap{padding:0 14px;line-height:1.4}.m{color:var(--mu);font-size:13px;display:block;margin-top:2px;cursor:pointer}
.cm{padding:6px 14px 0;font-size:13px}.cm p{margin:3px 0}.cin{display:flex;gap:8px;align-items:center;margin-top:6px}.cin .fi{flex:1;width:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid div{aspect-ratio:1/1;background:var(--so);overflow:hidden;position:relative;font-size:11px;color:var(--mu);padding:6px}.grid img,.grid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cnt{display:flex;gap:26px;margin-bottom:12px}.cnt div{color:var(--mu);font-size:12px}.cnt b{display:block;font-size:17px;color:var(--tx)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:6}
.sh{background:var(--bg);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}.sh h3{margin-bottom:10px}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--ln);border-radius:12px;min-height:110px;color:var(--mu);cursor:pointer;overflow:hidden}.up img,.up video{width:100%;max-height:260px;object-fit:cover}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://aavzlrerdnnkmecpmjsi.supabase.co';
const SB_KEY='sb_publishable_toXur_ed2gk7POMvB2Lfvw_J2JT-dFa';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAM='<svg class="i" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>';
const HOME='<svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>';
const USER='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>';
let step='boot',me=null,prof=null,em='',tab='home',tp={},wait=0,busy=false,feed=[],following=new Set(),cdata={},mode='login',joinedC=new Set(),cl=[],cur=null,np={file:null,kind:''};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function nice(e){return (e&&(e.status===429||/rate|seconds/i.test(e.message||'')))?'Too many attempts. Please wait a minute and try again.':(e&&e.message)||'Something went wrong'}
function lock(on){busy=on;document.querySelectorAll('.btn').forEach(b=>b.disabled=on)}
async function sendCode(resend){
 if(busy)return;
 const e=resend?em:$('#em').value.trim().toLowerCase();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Enter a valid email address');return}
 if(resend&&Date.now()<wait){toast('Please wait a few seconds before resending');return}
 lock(true);
 const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true}});
 lock(false);
 if(error){toast(nice(error));return}
 em=e;wait=Date.now()+30000;
 if(resend)toast('New code sent');else{step='verify';draw()}
}
async function verify(){
 if(busy)return;
 const t=$('#cd').value.replace(/\D/g,'');
 if(t.length<6){toast('Enter the code from your email');return}
 lock(true);
 const {data,error}=await sb.auth.verifyOtp({email:em,token:t,type:'email'});
 lock(false);
 if(error||!data.user){toast('That code is wrong or has expired');return}
 me=data.user;
 if(mode=='signup'){const {data:ex}=await sb.from('profiles').select('id').eq('id',me.id).maybeSingle();if(ex){toast('You already have an account. Signed you in.');await enter();return}}
 step='pw';draw();
}
async function enter(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(error){toast('Could not load your profile: '+error.message);step='welcome';draw();return}
 prof=data;
 if(prof){step='app';tab='home'}else{tp={name:'',user:'',bio:''};step='setup'}
 draw();
}
function pick(w,inp){
 const f=inp.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){toast('Please choose an image');return}
 if(f.size>5*1024*1024){toast('Image is too large (max 5 MB)');return}
 tp[w+'File']=f;tp[w+'Prev']=URL.createObjectURL(f);draw();
}
async function up(bucket,file){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
 const path=me.id+'/'+Date.now()+'.'+ext;
 const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});
 if(error)throw error;
 return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
async function save(){
 if(busy)return;
 const n=tp.name.trim(),u=tp.user.trim();
 if(!n){toast('Enter your name');return}
 if(!/^[a-z0-9._]{3,20}$/.test(u)){toast('Username: 3 to 20 letters, numbers, . or _');return}
 lock(true);
 try{
  let av=prof?prof.avatar_url:null,cv=prof?prof.cover_url:null;
  if(tp.avatarFile)av=await up('avatars',tp.avatarFile);
  if(tp.coverFile)cv=await up('covers',tp.coverFile);
  const row={id:me.id,username:u,full_name:n,bio:tp.bio.trim(),avatar_url:av,cover_url:cv};
  const {data,error}=await sb.from('profiles').upsert(row).select().single();
  if(error){toast(error.code==='23505'?'That username is taken, try another':error.message);lock(false);return}
  const first=!prof;prof=data;lock(false);step='app';tab=first?'home':'profile';draw();toast(first?'Welcome to Skillshow':'Profile updated');
 }catch(e){lock(false);toast('Upload failed: '+(e.message||e))}
}
function edit(){tp={name:prof.full_name,user:prof.username,bio:prof.bio||''};step='setup';draw()}
async function out(){await sb.auth.signOut();me=null;prof=null;em='';mode='login';step='welcome';draw()}
const HRT=f=>`<svg class="i" viewBox="0 0 24 24" style="${f?'fill:#ED4956;stroke:#ED4956':''}"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>`;
const CMT='<svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>';
const SND='<svg class="i" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>';
const PLS='<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>';
const ago=t=>{const s=(Date.now()-new Date(t))/1000;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const avt=(u,n)=>u?`<img src="${esc(u)}" alt="">`:esc((n||'?')[0]);
function cHtml(id){return `<div class="cm">${cdata[id].map(c=>`<p><b>${esc(c.profiles&&c.profiles.username)}</b> ${esc(c.body)}</p>`).join('')}<div class="cin"><input class="fi" id="ci${id}" placeholder="Add a comment" maxlength="500"><button class="lk" onclick="addC(${id})">Post</button></div></div>`}
function postH(p){
 const pr=p.profiles||{},liked=p.likes.some(l=>l.user_id==me.id),n=p.likes.length,cn=(p.comments[0]||{}).count||0,mine=p.user_id==me.id;
 return `<article class="post"><div class="ph"><div class="av">${avt(pr.avatar_url,pr.full_name)}</div><div><b>${esc(pr.full_name)}</b><small>@${esc(pr.username)} · ${ago(p.created_at)}${p.communities?` · in ${esc(p.communities.name)}`:''}</small></div>${mine?`<button class="fl" onclick="delPost(${p.id})">Delete</button>`:`<button class="fl" onclick="toggleFol('${p.user_id}')">${following.has(p.user_id)?'Following':'Follow'}</button>`}</div>
${p.media_url?`<div class="md">${p.media_type=='video'?`<video src="${esc(p.media_url)}" controls playsinline preload="metadata"></video>`:`<img src="${esc(p.media_url)}" alt="" loading="lazy">`}<span class="wmk">Skillshow</span></div>`:''}
<div class="ac"><span onclick="like(${p.id})">${HRT(liked)}</span><span onclick="openC(${p.id})">${CMT}</span><span onclick="share()">${SND}</span></div>
<div class="cap"><b>${n} like${n==1?'':'s'}</b>${p.caption?`<br><b>${esc(pr.username)}</b> ${esc(p.caption)}`:''}${cn?`<span class="m" onclick="openC(${p.id})">View all ${cn} comment${cn==1?'':'s'}</span>`:''}</div>${cdata[p.id]?cHtml(p.id):''}</article>`}
function drawFeed(){const f=$('#feed');if(!f)return;f.innerHTML=`<div style="text-align:right;padding:2px 10px"><button class="lk" onclick="loadFeed()">Refresh</button></div>`+(feed.length?feed.map(postH).join(''):`<p class="co" style="padding:30px 20px;text-align:center">No posts yet. Be the first. Tap the + button to share your skill.</p>`)}
async function loadFeed(){
 const m=await sb.from('community_members').select('community_id').eq('user_id',me.id);
 joinedC=new Set((m.data||[]).map(x=>x.community_id));
 let q=sb.from('posts').select('id,user_id,caption,media_url,media_type,created_at,community_id,profiles!user_id(username,full_name,avatar_url),communities(name),likes(user_id),comments(count)').order('created_at',{ascending:false}).limit(30);
 if(tab=='cview')q=q.eq('community_id',cur);else q=joinedC.size?q.or('community_id.is.null,community_id.in.('+[...joinedC].join(',')+')'):q.is('community_id',null);
 const [a,b]=await Promise.all([q,sb.from('follows').select('following_id').eq('follower_id',me.id)]);
 if(a.error){toast('Could not load the feed: '+a.error.message);return}
 feed=a.data;following=new Set((b.data||[]).map(x=>x.following_id));drawFeed();
}
async function like(id){
 const p=feed.find(x=>x.id==id),l=p.likes.some(x=>x.user_id==me.id);
 p.likes=l?p.likes.filter(x=>x.user_id!=me.id):p.likes.concat({user_id:me.id});drawFeed();
 const {error}=l?await sb.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await sb.from('likes').insert({post_id:id,user_id:me.id});
 if(error){toast(error.message);loadFeed()}
}
async function getC(id){const {data}=await sb.from('comments').select('id,body,profiles!user_id(username)').eq('post_id',id).order('created_at');return data||[]}
async function openC(id){if(cdata[id]){delete cdata[id];drawFeed();return}cdata[id]=await getC(id);drawFeed();const e=$('#ci'+id);if(e)e.focus()}
async function addC(id){
 const e=$('#ci'+id),t=e.value.trim();if(!t)return;
 const {error}=await sb.from('comments').insert({post_id:id,user_id:me.id,body:t});
 if(error){toast(error.message);return}
 cdata[id]=await getC(id);feed.find(x=>x.id==id).comments=[{count:cdata[id].length}];drawFeed();
}
async function delPost(id){
 if(!confirm('Delete this post?'))return;
 const p=feed.find(x=>x.id==id),{error}=await sb.from('posts').delete().eq('id',id);
 if(error){toast(error.message);return}
 const k=p.media_url&&p.media_url.split('/object/public/posts/')[1];if(k)sb.storage.from('posts').remove([decodeURIComponent(k)]);
 feed=feed.filter(x=>x.id!=id);drawFeed();toast('Post deleted');
}
async function toggleFol(uid){
 const on=following.has(uid);on?following.delete(uid):following.add(uid);drawFeed();
 const {error}=on?await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid):await sb.from('follows').insert({follower_id:me.id,following_id:uid});
 if(error){toast(error.message);loadFeed()}
}
function share(){const u=location.href;if(navigator.share)navigator.share({title:'Skillshow',url:u}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(u);toast('Link copied')}}
function openNew(cid){
 np={file:null,kind:'',cid:cid||null};
 const o=document.createElement('div');o.id='ov';o.className='ov';o.onclick=e=>{if(e.target==o)closeNew()};
 o.innerHTML=`<div class="sh"><h3>New post</h3><input type="file" id="fm" accept="image/*,video/*" hidden onchange="pickM(this)"><div class="up" id="upl" onclick="$('#fm').click()">${CAM} Add a photo or video</div><textarea class="fi" id="nt" rows="3" maxlength="1000" placeholder="Describe your work" style="margin:10px 0"></textarea><button class="btn" onclick="sendPost()">Share</button></div>`;
 document.body.appendChild(o);
}
function closeNew(){const o=$('#ov');if(o)o.remove()}
function pickM(inp){
 const f=inp.files[0];if(!f)return;
 const v=f.type.startsWith('video/'),i=f.type.startsWith('image/');
 if(!v&&!i){toast('Please choose a photo or video');return}
 if(f.size>(v?50:10)*1024*1024){toast(v?'Video is too large (max 50 MB)':'Photo is too large (max 10 MB)');return}
 np={file:f,kind:v?'video':'image',cid:np.cid};const u=URL.createObjectURL(f),b=$('#upl');
 b.onclick=null;b.innerHTML=`<div style="width:100%">${v?`<video src="${u}" controls playsinline></video>`:`<img src="${u}" alt="">`}<button class="lk" onclick="$('#fm').click()">Change</button></div>`;
}
async function sendPost(){
 if(busy)return;
 const cap=$('#nt').value.trim();
 if(!cap&&!np.file){toast('Add a photo, a video or a caption');return}
 lock(true);
 try{
  let url=null,kind=null;
  if(np.file){url=await up('posts',np.file);kind=np.kind}
  const {error}=await sb.from('posts').insert({user_id:me.id,caption:cap,media_url:url,media_type:kind,community_id:np.cid||null});
  if(error)throw error;
  lock(false);closeNew();toast('Posted');tab=np.cid?'cview':'home';draw();
 }catch(e){lock(false);toast('Could not post: '+(e.message||e))}
}
async function loadMine(){
 const [a,f1,f2]=await Promise.all([sb.from('posts').select('id,caption,media_url,media_type').eq('user_id',me.id).order('created_at',{ascending:false}),sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',me.id)]);
 const g=$('#mine');if(!g)return;const d=a.data||[];
 $('#pc').textContent=d.length;$('#fl1').textContent=f1.count||0;$('#fl2').textContent=f2.count||0;
 g.innerHTML=d.length?`<div class="grid">${d.map(p=>`<div>${p.media_url?(p.media_type=='video'?`<video src="${esc(p.media_url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(p.media_url)}" alt="" loading="lazy">`):esc((p.caption||'').slice(0,60))}</div>`).join('')}</div>`:`<p class="co" style="text-align:center;padding:24px">Share your first photo or video with the + button.</p>`;
}
function setMode(m){const e=$('#em');if(e)em=e.value.trim();mode=m;draw()}
function showPw(){document.querySelectorAll('input[data-pw]').forEach(i=>i.type=i.type=='password'?'text':'password')}
async function doLogin(){
 if(busy)return;
 const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
 if(!e||!p){toast('Enter your email and password');return}
 lock(true);
 const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});
 lock(false);
 if(error){toast(/invalid/i.test(error.message)?'Wrong email or password':nice(error));return}
 em=e;me=data.user;await enter();
}
async function setPw(){
 if(busy)return;
 const a=$('#p1').value,b=$('#p2').value;
 if(a.length<8){toast('Password must be at least 8 characters');return}
 if(a!==b){toast('Passwords do not match');return}
 lock(true);
 const {error}=await sb.auth.updateUser({password:a});
 lock(false);
 if(error){toast(error.message);return}
 toast('Password saved');await enter();
}
const GRP='<svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
const BACK='<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>';
const CC=['#5B1424','#8A5A12','#7C2336','#6B4A1A','#3E0D18'];
function drawComms(){
 const g=$('#clist');if(!g)return;
 g.innerHTML=cl.length?cl.map(c=>{const n=(c.community_members[0]||{}).count||0,j=joinedC.has(c.id);return `<div class="lr" onclick="openCommunity(${c.id})"><div class="av" style="background:${CC[c.id%5]};color:#fff">${esc(c.name[0].toUpperCase())}</div><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><small>${n} member${n==1?'':'s'}${c.description?' · '+esc(c.description):''}</small></div><button class="jb ${j?'j':''}" onclick="event.stopPropagation();toggleJoin(${c.id})">${j?'Joined':'Join'}</button></div>`}).join(''):`<p class="co" style="padding:30px 20px;text-align:center">No communities yet. Create the first one.</p>`;
}
async function loadComms(){
 const [a,m]=await Promise.all([sb.from('communities').select('id,name,description,community_members(count)').order('created_at',{ascending:false}),sb.from('community_members').select('community_id').eq('user_id',me.id)]);
 const g=$('#clist');if(!g)return;
 if(a.error){g.innerHTML=`<p class="co" style="padding:20px">Could not load communities: ${esc(a.error.message)}</p>`;return}
 joinedC=new Set((m.data||[]).map(x=>x.community_id));cl=a.data;drawComms();
}
function openCommunity(id){cur=id;tab='cview';draw()}
async function loadCview(){
 const [c,m]=await Promise.all([sb.from('communities').select('id,name,description,creator_id,community_members(count)').eq('id',cur).maybeSingle(),sb.from('community_members').select('community_id').eq('user_id',me.id)]);
 joinedC=new Set((m.data||[]).map(x=>x.community_id));
 const d=c.data,h=$('#chead');if(!h)return;
 if(!d){h.innerHTML='<p class="co" style="padding:20px">Community not found.</p>';return}
 const n=(d.community_members[0]||{}).count||0,j=joinedC.has(d.id);
 h.innerHTML=`<div class="cvh"><div class="av big" style="background:${CC[d.id%5]};color:#fff">${esc(d.name[0].toUpperCase())}</div><div><b style="font-size:18px">${esc(d.name)}</b><small class="co" style="display:block">${n} member${n==1?'':'s'}</small></div></div>${d.description?`<p class="co" style="padding:0 14px 10px">${esc(d.description)}</p>`:''}<div class="row" style="padding:0 14px 12px"><button class="btn ${j?'o':''}" onclick="toggleJoin(${d.id})">${j?'Leave community':'Join community'}</button>${j?`<button class="btn" onclick="openNew(${d.id})">Post here</button>`:''}</div>${d.creator_id==me.id?`<div style="padding:0 14px 8px"><button class="lk" style="padding-left:0" onclick="delComm(${d.id})">Delete this community</button></div>`:''}`;
 loadFeed();
}
async function toggleJoin(id){
 const j=joinedC.has(id);
 const {error}=j?await sb.from('community_members').delete().eq('community_id',id).eq('user_id',me.id):await sb.from('community_members').insert({community_id:id,user_id:me.id,role:'member'});
 if(error){toast(error.message);return}
 toast(j?'You left the community':'You joined the community');
 if(tab=='cview')loadCview();else loadComms();
}
async function delComm(id){
 if(!confirm('Delete this community and all its posts?'))return;
 const {error}=await sb.from('communities').delete().eq('id',id);
 if(error){toast(error.message);return}
 toast('Community deleted');tab='comm';draw();
}
function newComm(){
 const o=document.createElement('div');o.id='ov';o.className='ov';o.onclick=e=>{if(e.target==o)closeNew()};
 o.innerHTML=`<div class="sh"><h3>Create a community</h3><div class="lbl">Name</div><input class="fi" id="cnm" maxlength="40" placeholder="e.g. Graphic Designers in Port Harcourt" style="margin:6px 0 10px"><div class="lbl">Description</div><textarea class="fi" id="cds" rows="3" maxlength="200" placeholder="What is this community about?" style="margin:6px 0 10px"></textarea><button class="btn" onclick="mkComm()">Create community</button></div>`;
 document.body.appendChild(o);
}
async function mkComm(){
 if(busy)return;
 const n=$('#cnm').value.trim(),d=$('#cds').value.trim();
 if(n.length<3){toast('Name must be at least 3 characters');return}
 lock(true);
 const {data,error}=await sb.from('communities').insert({name:n,description:d,creator_id:me.id}).select('id').single();
 if(error){lock(false);toast(error.code==='23505'?'That name is already taken':error.message);return}
 const r=await sb.from('community_members').insert({community_id:data.id,user_id:me.id,role:'admin'});
 lock(false);
 if(r.error){toast(r.error.message);return}
 closeNew();toast('Community created');openCommunity(data.id);
}
const V={
boot:()=>`<div class="w" style="margin-top:80px;text-align:center"><div class="wm">Skillshow<b></b></div></div>`,
welcome:()=>{const L=mode=='login',R=mode=='reset';return `<div class="w"><div class="wm" style="margin-top:30px">Skillshow<b></b></div><h1>${L?'Welcome back':R?'Reset your password':'Create your account'}</h1><p>${L?'Log in with your email and password.':R?'Enter your email and we will send you a code to set a new password.':'Enter your email. We will send you a code to confirm it is really you, then you will set a password.'}</p><div class="lbl">Email address</div><input class="fi" id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" value="${esc(em)}">${L?`<div class="lbl">Password</div><input class="fi" id="pw" data-pw type="password" autocomplete="current-password" placeholder="Your password"><button class="lk" style="align-self:flex-start;padding-left:0" onclick="showPw()">Show password</button><button class="btn" onclick="doLogin()">Log in</button><button class="lk" onclick="setMode('reset')">Forgot password?</button><button class="lk" onclick="setMode('signup')">New here? Create an account</button>`:`<button class="btn" onclick="sendCode()">${R?'Send code':'Continue'}</button><button class="lk" onclick="setMode('login')">${R?'Back to log in':'Already have an account? Log in'}</button>`}</div>`},
pw:()=>`<div class="w"><h1>${mode=='reset'?'Set a new password':'Create your password'}</h1><p>Use at least 8 characters. You will use it with your email to log in next time.</p><div class="lbl">Password</div><input class="fi" id="p1" data-pw type="password" autocomplete="new-password" placeholder="At least 8 characters"><div class="lbl">Confirm password</div><input class="fi" id="p2" data-pw type="password" autocomplete="new-password" placeholder="Type it again"><button class="lk" style="align-self:flex-start;padding-left:0" onclick="showPw()">Show password</button><button class="btn" onclick="setPw()">Continue</button></div>`,
verify:()=>`<div class="w"><button class="lk" style="align-self:flex-start;padding-left:0" onclick="step='welcome';draw()">Back</button><h1>Check your email</h1><p>We sent a code to <b style="color:var(--tx)">${esc(em)}</b>. Enter it below. Check your spam folder if you do not see it.</p><input class="fi" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code" style="letter-spacing:6px;font-size:20px;text-align:center"><button class="btn" onclick="verify()">Verify email</button><button class="lk" onclick="sendCode(1)">Resend code</button></div>`,
setup:()=>{const av=tp.avatarPrev||(prof&&prof.avatar_url),cv=tp.coverPrev||(prof&&prof.cover_url);return `<div class="w" style="gap:10px"><h1>${prof?'Edit profile':'Create your profile'}</h1><p>Add a photo, a cover and a short bio so people know who you are.</p>
<input type="file" id="fc" accept="image/*" hidden onchange="pick('cover',this)"><input type="file" id="fa" accept="image/*" hidden onchange="pick('avatar',this)">
<div class="cvu" style="${cv?`background-image:url('${esc(cv)}')`:''}" onclick="$('#fc').click()">${cv?'':CAM+'Add cover photo'}</div>
<div class="dpu" onclick="$('#fa').click()">${av?`<img src="${esc(av)}" alt="">`:CAM}</div>
<div class="lbl">Full name</div><input class="fi" value="${esc(tp.name)}" oninput="tp.name=this.value" placeholder="Your name" maxlength="60">
<div class="lbl">Username</div><input class="fi" value="${esc(tp.user)}" oninput="tp.user=this.value.toLowerCase().replace(/[^a-z0-9._]/g,'');this.value=tp.user" placeholder="username" maxlength="20" autocapitalize="none" autocorrect="off">
<div class="lbl">Bio</div><textarea class="fi" rows="3" maxlength="150" oninput="tp.bio=this.value" placeholder="What do you do? Tell people in a line or two.">${esc(tp.bio)}</textarea>
<button class="btn" onclick="save()">${prof?'Save changes':'Finish and start'}</button>${prof?`<button class="lk" onclick="step='app';draw()">Cancel</button>`:''}</div>`},
app:()=>{
 const hd=`<div class="hd"><div class="wm">Skillshow<b></b></div></div>`;
 const nv=`<nav><span class="${tab=='home'?'on':''}" onclick="tab='home';draw()">${HOME}</span><span class="${tab=='comm'||tab=='cview'?'on':''}" onclick="tab='comm';draw()">${GRP}</span><span onclick="openNew()">${PLS}</span><span class="${tab=='profile'?'on':''}" onclick="tab='profile';draw()">${USER}</span></nav>`;
 if(tab=='home')return hd+`<div id="feed"><p class="co" style="padding:30px 20px;text-align:center">Loading feed…</p></div>`+nv;
 if(tab=='comm')return hd+`<div class="ctop"><b style="font-size:18px">Communities</b><button class="jb" onclick="newComm()">Create</button></div><div id="clist"><p class="co" style="padding:30px 20px;text-align:center">Loading…</p></div>`+nv;
 if(tab=='cview')return `<div class="hd"><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;cursor:pointer" onclick="tab='comm';draw()">${BACK}Communities</div></div><div id="chead"></div><div id="feed"></div>`+nv;
 return hd+`<div class="cov" style="${prof.cover_url?`background-image:url('${esc(prof.cover_url)}')`:''}"></div><div class="pf"><div class="dp">${prof.avatar_url?`<img src="${esc(prof.avatar_url)}" alt="">`:esc(prof.full_name[0]||'?')}</div><div class="pn"><b>${esc(prof.full_name)}</b><small>@${esc(prof.username)}</small></div><p class="bio">${esc(prof.bio)||'No bio yet.'}</p><div class="cnt"><div><b id="pc">0</b>Posts</div><div><b id="fl1">0</b>Followers</div><div><b id="fl2">0</b>Following</div></div><div class="row"><button class="btn o" onclick="edit()">Edit profile</button><button class="btn o" onclick="out()">Sign out</button></div></div><div id="mine"></div>`+nv}
};
function draw(){$('#app').innerHTML=V[step]();window.scrollTo(0,0);if(step=='app'){if(tab=='home')loadFeed();else if(tab=='comm')loadComms();else if(tab=='cview')loadCview();else loadMine()}}
(async()=>{
 draw();
 const {data}=await sb.auth.getSession();
 if(data.session){me=data.session.user;await enter()}else{step='welcome';draw()}
})();
</script>
</body>
</html>
